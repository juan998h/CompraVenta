spring.application.name=CompraVenta

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:bikersdb
spring.datasource.username=sa
spring.datasource.password=

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- Seguridad (clave solo para desarrollo) ---
seguridad.jwt.secreto=bikersdreams-clave-secreta-solo-para-desarrollo-2026
# Cuanto dura un token antes de vencer
seguridad.jwt.duracion-minutos=60

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console